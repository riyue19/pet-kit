# ============================================================
# fishing_lines.yaml —— 台词池（不调用 LLM 的兜底台词）
# 占位符：{fish} 鱼名  {size} 尺寸(cm)  {place} 地点；offline_summary 里用 {n} 竿数、{fish_count} 鱼数
# 结构：outcome → rarity/类别 → mood → 台词列表（每组至少 5 句，防重复）
# mood：neutral | happy | grumpy ；找不到对应 mood 时退回 neutral
# ============================================================
catch:
  common:
    neutral:
      - "钓到一条{fish}，{size}厘米。"
      - "{fish}上钩了，普通货色。"
      - "嗯，{fish}。放进背包了。"
      - "又是{fish}……行吧。"
      - "{size}厘米的{fish}，中规中矩。"
    happy:
      - "钓到{fish}啦！"
      - "今天手感不错，{fish}！"
      - "{fish}，{size}厘米，收下~"
      - "一条{fish}，开张大吉。"
      - "{place}的{fish}也不赖嘛。"
    grumpy:
      - "又是{fish}，就不能来点别的吗。"
      - "{fish}……我才不稀罕。"
      - "哼，{size}厘米，凑合收着。"
      - "别看我，{fish}就是这样的。"
      - "{fish}。随便吧。"
  uncommon:
    neutral:
      - "这条{fish}不错，{size}厘米。"
      - "{fish}上钩了，比平时的好一点。"
      - "唔，{fish}，有点意思。"
      - "{size}厘米的{fish}，值点钱。"
      - "{fish}来了，今天运气还行。"
  rare:
    neutral:
      - "{fish}！{size}厘米！"
      - "稀有的{fish}……居然被我钓到了。"
      - "等一下，这是{fish}？！"
      - "{size}厘米的{fish}，今天值了。"
      - "好家伙，{fish}。"
  legendary:
    neutral:
      - "……是{fish}。我没眼花吧？"
      - "传说里的{fish}，真的存在……"
      - "{size}厘米的{fish}！快，快记下来！"
      - "我、我钓到{fish}了？！"
      - "{fish}……今天可以吹一整年。"
bite:        # 稀有鱼咬钩、等你点的那几秒
  neutral:
    - "！！有动静！"
    - "咬钩了，快！"
    - "浮漂沉下去了！"
    - "有大家伙，帮我一把！"
    - "来了来了——"
escape:
  neutral:
    - "啊，跑了……"
    - "差一点就上来了。"
    - "线一松，它溜了。"
    - "可恶，下次一定。"
    - "那条鱼肯定很大，我发誓。"
empty:
  neutral:
    - "……什么都没有。"
    - "鱼都睡着了吧。"
    - "空军。"
    - "嗯，水很清。"
    - "再等等。"
  streak:   # 连续空军 >= 3 时使用
    - "连着空军了，水里是不是没鱼。"
    - "今天的鱼都在躲我。"
    - "我开始怀疑这片水了。"
    - "再空一次我就换地方。"
    - "安静，是钓鱼的一部分……大概。"
junk:
  neutral:
    - "钓到了{fish}。谁扔的。"
    - "{fish}……水里怎么会有这个。"
    - "这不是鱼，是{fish}。"
    - "好的，今天的收获是{fish}。"
    - "{fish}，扔回去吧。"
bottle:
  neutral:
    - "有个漂流瓶！里面有信。"
    - "水里漂来一个瓶子，要看看吗？"
    - "瓶子里好像塞着纸条。"
    - "是漂流瓶耶。"
    - "有人给大海写信了。"
offline_summary:
  neutral:
    - "你不在的时候我钓了{n}竿，收获{fish_count}条鱼。"
    - "这段时间一共钓了{n}竿，具体看背包吧。"
    - "我替你守着鱼竿，{n}竿都记下了。"
    - "离开的时候没闲着：{n}竿，{fish_count}条。"
    - "回来啦。你错过了{n}竿，有{fish_count}条鱼。"
