# ============================================================
# fish.yaml —— 钓鱼玩法的全部数值与内容配置（改这里，不要改代码）
# 约定：time = any | dawn(5-8) | day(8-18) | dusk(18-21) | night(21-5)
#       weather = any | sunny | cloudy | rain
#       template / patterns 对应 assets/fish/ 里的鱼形模板与花纹
#       eel 模板只支持 stripes / spots / belly / lateral / plain
# ============================================================

game:
  wait_min_sec: 300             # 抛竿后最短等多久才有动静（秒，真实时间）；范围 180-21600
  wait_max_sec: 10800           # 最长等多久（秒）；范围 180-43200。每一竿在两者之间随机，短的多、长的少
  offline_catchup_cap: 24       # 离线补算最多多少竿
  offline_catchup_max_hours: 8
  pity_empty_streak: 4          # 连续空军这么多次后，下一竿必有鱼（保底）
  bite_window_ms: 3000          # 稀有及以上的咬钩窗口
  llm_budget_per_day: 30        # 钓鱼相关 LLM 调用日上限，超了只用台词池
  animate_empty: false          # 空军是否播放动画（false = 只有一圈很小的水波，不打扰）
  weather_change_hours: 3       # 模拟天气每隔多少小时重新抽一次
  hud_animation: true           # false = 轻量档：桌宠旁的钓鱼小窗只换静态画面，不播动画
  hud_placed: true              # 钓鱼小窗是否放在桌宠旁边（false = 收回，只在控制台的钓鱼画面里看）
  hud_scale: 1.0                # 钓鱼小窗大小，0.6-2.5
  # 以上 wait_min_sec / wait_max_sec / llm_budget_per_day / animate_empty / bite_window_ms /
  # hud_animation / hud_placed / hud_scale 也可以在控制台「小游戏 → 挂机钓鱼」里改；控制台改过的值优先于这里。

# ---------- 桌宠钓鱼时的性格（0~1） ----------
persona:
  patience: 0.5     # 耐心：越高，稀有鱼咬钩时你没来得及点，它自己抓住的概率越大
  talkative: 0.5    # 话多：越高，钓到普通鱼时越常开口
  mood: neutral     # 台词池的语气分组：neutral / happy / grumpy（fishing_lines.yaml 里可以加）

# ---------- 模拟天气的权重 ----------
weather_weights: {sunny: 50, cloudy: 30, rain: 20}

# ---------- 结果大类的基础权重（相加不必为 100，按比例） ----------
outcome_weights: {empty: 50, fish: 38, junk: 8, bottle: 4}

# ---------- 稀有度：先按稀有度抽，再在该稀有度里按物种权重抽 ----------
rarity:
  common:    {base_weight: 70, label: 普通,   first_bonus: 5,   price_mult: 1.0}
  uncommon:  {base_weight: 22, label: 少见,   first_bonus: 15,  price_mult: 1.0}
  rare:      {base_weight: 7,  label: 稀有,   first_bonus: 50,  price_mult: 1.0, bite_window: true}
  legendary: {base_weight: 1,  label: 传说,   first_bonus: 200, price_mult: 1.0, bite_window: true}

# ---------- 地点 ----------
locations:
  pond:  {name: 小池塘, unlock_cost: 0,   requires_rod_level: 1}
  river: {name: 河口,   unlock_cost: 100, requires_rod_level: 1}
  sea:   {name: 夜海,   unlock_cost: 300, requires_rod_level: 2}

# ---------- 饵（每竿消耗 1 个；用完自动退回"无饵"） ----------
baits:
  none:  {name: 无饵,   cost: 0,  fish_weight_mult: 1.0, rarity_mult: {}}
  bread: {name: 面包屑, cost: 2,  fish_weight_mult: 1.10, rarity_mult: {}}
  worm:  {name: 虫饵,   cost: 5,  fish_weight_mult: 1.20, rarity_mult: {}}
  lure:  {name: 亮片,   cost: 10, fish_weight_mult: 1.10, rarity_mult: {rare: 1.5, legendary: 1.3}}

# ---------- 鱼竿 ----------
rods:
  1: {name: 竹竿,   cost: 0,   size_mult: 1.00, rarity_mult: {rare: 1.0, legendary: 1.0}}
  2: {name: 玻璃钢, cost: 150, size_mult: 1.10, rarity_mult: {rare: 1.2, legendary: 1.2}}
  3: {name: 碳素竿, cost: 500, size_mult: 1.20, rarity_mult: {rare: 1.5, legendary: 1.5}}

# ---------- 经济 ----------
economy:
  price_size_clamp: [0.6, 2.0]  # 售价 = base_price * clamp(size/mean) * (巨物 1.5)
  trophy_price_mult: 1.5
  trophy_sd: 1.5                # 尺寸 >= mean + 1.5*sd 视为"巨物"
  release_affinity: 0.3         # 放生一条 +好感度（状态栏关着时忽略）
  release_affinity_daily_cap: 1.5   # 每天靠放生最多涨这么多
  luck_per_affinity_level: 0.02 # 好感度等级对稀有度的加成，封顶 +10%

