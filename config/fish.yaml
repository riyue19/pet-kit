  - {id: boot, name: 破靴子, icon: junk/boot.svg, sell_price: 1}
  - {id: can,  name: 易拉罐, icon: junk/can.svg,  sell_price: 1}

# ---------- 漂流瓶 ----------
bottle:
  icon: junk/bottle.svg
  pool_min: 20                  # 本地信件池低于这个数就在空闲时批量生成一批
  batch_size: 10
  reward_coins: {min: 2, max: 8}
