# 隐私设置（M6）：屏幕感知遵守这里的名单。控制台「感知」页可编辑；改完立即生效，无需重启。
# 进程名不区分大小写、整名匹配（任务管理器「详细信息」里的名称，如 chrome.exe）；标题关键词不区分大小写、包含即匹配。
#
# block_*：黑名单。命中的窗口绝不截图、不评论，标题也不会写进事件和日志。网银、支付、密码管理器、无痕浏览等。
# quiet_*：免打扰。命中的窗口在前台时桌宠不主动说话（会议、录屏、直播）。
block_processes:
- keepass.exe
- keepassxc.exe
- 1password.exe
- bitwarden.exe
- dashlane.exe
- enpass.exe
- alipay.exe
- 支付宝.exe
- cmb.exe
- icbc.exe
- ccb.exe
- abchina.exe
- boc.exe
- tdxw.exe
- hexin.exe
- eastmoney.exe
- thsfin.exe
