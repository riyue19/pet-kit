[project]
name = "pet-backend"
version = "0.1.0"
description = "Desktop pet core (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "keyring>=25",
  "openai>=1.50",
  "ruamel.yaml>=0.18",
  "sherpa-onnx>=1.12",
  "numpy>=2",
  "httpx>=0.27",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "mss>=9",
  "pillow>=10",
  "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]
